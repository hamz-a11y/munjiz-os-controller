name: Munjiz OS Controller CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Test (${{ matrix.os }} | Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile & Lint with Ruff
        run: |
          python -m py_compile munjiz_os_controller.py
          ruff check munjiz_os_controller.py

      - name: Run 3-Layer Hybrid Router & Live Cursor Self-Test
        run: |
          python munjiz_os_controller.py --mode demo

      - name: Verify MCP Server & OpenAI Tool Schemas
        run: |
          python -c "import munjiz_os_controller as m; schemas = m.get_openai_tools_schema(); assert len(schemas) >= 5, 'Missing tool schemas'; srv = m.create_munjiz_mcp_server(); assert srv is not None, 'MCP Server failed to initialize'; print('Verified', len(schemas), 'tools and FastMCP server instance.')"
